[package]
name = "refledger-verify"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Independent verifier for the Refledger transparency log"

# CRITICAL CONSTRAINT:
# This crate MUST NOT depend on refledger-log — not as a path dependency,
# not via workspace inheritance, not transitively through a shared helper
# crate. The verifier exists to catch bugs in the signer. A verifier that
# shares the signer's canonicalisation code cannot catch a canonicalisation
# bug. The two crates share only a JSON wire format and a written
# specification, never code.
#
# Do not add: refledger-log = { path = "../refledger-log" }
# Do not add any crate that re-exports or wraps refledger-log.

[lib]
name = "refledger_verify"
path = "src/lib.rs"

[[bin]]
name = "refledger-verify"
path = "src/main.rs"

[dependencies]
# Intentionally does not depend on refledger-log. See comment above.
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = "2"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[dev-dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
