[package]
name = "refledger-poller"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "GitHub tag poller and observation model for Refledger"

[[bin]]
name = "refledger-poller"
path = "src/bin/refledger-poller.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
libc = "0.2"
ureq = { version = "2", default-features = false, features = ["tls"] }
url = "2"
refledger-log = { path = "../refledger-log" }

[dev-dependencies]
proptest = "1"
trybuild = "1"
tempfile = "3"
time = { version = "0.3", features = ["serde", "formatting", "parsing"] }
