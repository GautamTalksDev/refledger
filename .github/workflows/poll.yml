# Refledger poller: one sweep per clock or scheduled GitHub Actions run.
#
# Primary trigger: Cloudflare Worker clock/ (workflow_dispatch).
# schedule: below remains as backup. Concurrency group prevents overlap.
#
# Inert until repository variable REFLEDGER_ENABLED is set to the string true.
# Do not set that variable in this file; genesis is an operator flip.

name: poll

on:
  schedule:
    # Every 5 minutes at :02, :07, :12, … :57. Never :00 (busy minute).
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: refledger-poller
  cancel-in-progress: false

# Least privilege at the workflow root. The poll job elevates for pushes.
permissions:
  contents: read

jobs:
  poll:
    name: once
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Signing key lives only in Environment "ledger" (main branch only).
    environment: ledger
    # contents: write is required to push the data branch and seal ledger commits.
    permissions:
      contents: write
    if: ${{ vars.REFLEDGER_ENABLED == 'true' }}
    steps:
      - name: checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: main
          fetch-depth: 0
          persist-credentials: false

      - name: prepare data worktree at ./state
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          STATE="${GITHUB_WORKSPACE}/state"
          mkdir -p "$STATE"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add --force "$STATE" origin/data
          else
            # First run: orphan data branch with empty store layout.
            git checkout --orphan data
            git rm -rf . >/dev/null 2>&1 || true
            mkdir -p observations log
            touch observations/.gitkeep log/.gitkeep
            printf '%s\n' '.store.lock' > .gitignore
            git add -A
            git -c user.email=refledger-poller@users.noreply.github.com \
                -c user.name=refledger-poller \
                commit -m "data branch genesis"
            git push -u origin HEAD:data
            git checkout main
            git worktree add --force "$STATE" origin/data
          fi
          # Ensure the lock file is never published even on older data tips.
          if [[ ! -f "$STATE/.gitignore" ]] || ! grep -qxF '.store.lock' "$STATE/.gitignore"; then
            echo '.store.lock' >> "$STATE/.gitignore"
          fi

      - name: rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: "1.98.1"

      - name: restore poller binary cache
        id: cache-poller
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: main/target/release/refledger-poller
          key: poller-${{ runner.os }}-${{ hashFiles('main/crates/**', 'main/Cargo.lock') }}

      - name: build poller on cache miss
        if: steps.cache-poller.outputs.cache-hit != 'true'
        working-directory: main
        run: cargo build --release -p refledger-poller

      - name: run once
        id: once
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFLEDGER_GITHUB_TOKEN: ${{ secrets.REFLEDGER_GITHUB_TOKEN }}
          # Environment secret on "ledger" only; never a repository-level secret.
          REFLEDGER_SIGNING_KEY: ${{ secrets.REFLEDGER_SIGNING_KEY }}
          REFLEDGER_PUBLISH_CLONE: ${{ github.workspace }}/main
          # Seal may finish before the data-branch commit; never push main yet.
          REFLEDGER_DEFER_LEDGER_PUBLISH: "1"
          REFLEDGER_REQUIRE_ENABLED: "1"
          REFLEDGER_ENABLED: ${{ vars.REFLEDGER_ENABLED }}
          # Concurrency group is the writer lock on Actions.
          REFLEDGER_SKIP_STORE_LOCK: "1"
          DATA_DIR: ${{ github.workspace }}/state
        run: |
          set -euo pipefail
          # Infer scheduled slot locally; never echo secrets.
          ACTUAL=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          export REFLEDGER_SCHEDULED_AT="${REFLEDGER_SCHEDULED_AT:-$ACTUAL}"
          OUT=$(./target/release/refledger-poller once \
            --data "${DATA_DIR}" \
            --watched population/watched.jsonl)
          {
            echo "commit_msg<<EOF"
            echo "$OUT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "$OUT"

      - name: commit state to data branch
        working-directory: ${{ github.workspace }}/state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pass via env so the value is not interpolated into the script body
          # (zizmor template-injection). Commit message is our own poller output.
          COMMIT_MSG: ${{ steps.once.outputs.commit_msg }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          MSG="${COMMIT_MSG:-}"
          if [[ -z "$MSG" ]]; then
            MSG="poll $(date -u +"%Y-%m-%dT%H:%M:%SZ") seq unknown"
          fi
          git config user.email refledger-poller@users.noreply.github.com
          git config user.name refledger-poller
          # Never publish the process-local lock file.
          if [[ ! -f .gitignore ]] || ! grep -qxF '.store.lock' .gitignore; then
            echo '.store.lock' >> .gitignore
          fi
          git add -A
          git reset HEAD -- .store.lock 2>/dev/null || true
          rm -f .store.lock
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "$MSG"
          # Fast-forward only. Retry once. Never force.
          if ! git push origin HEAD:data; then
            git pull --ff-only origin data
            git push origin HEAD:data || {
              echo "FATAL: fast-forward push of data branch failed after retry"
              exit 1
            }
          fi

      - name: publish sealed ledger to main
        working-directory: main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REFLEDGER_SIGNING_KEY: ${{ secrets.REFLEDGER_SIGNING_KEY }}
          REFLEDGER_PUBLISH_CLONE: ${{ github.workspace }}/main
          REFLEDGER_SKIP_STORE_LOCK: "1"
          DATA_DIR: ${{ github.workspace }}/state
        run: |
          set -euo pipefail
          # After data is durable: FF-push sealed log/ to main and backfill Rekor.
          ./target/release/refledger-poller publish-pending --data "${DATA_DIR}"

      - name: commit witness/publish state to data branch
        working-directory: ${{ github.workspace }}/state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config user.email refledger-poller@users.noreply.github.com
          git config user.name refledger-poller
          git add -A
          git reset HEAD -- .store.lock 2>/dev/null || true
          rm -f .store.lock
          if git diff --cached --quiet; then
            echo "no witness/publish state changes"
            exit 0
          fi
          git commit -m "poll witness/publish follow-up $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          if ! git push origin HEAD:data; then
            git pull --ff-only origin data
            git push origin HEAD:data || {
              echo "FATAL: fast-forward push of data branch failed after retry"
              exit 1
            }
          fi
