# Dependabot: keep Actions SHAs, Cargo.lock, and clock/ npm pins moving.
# A supply chain product that lets pins rot is not credible.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10

  - package-ecosystem: npm
    directory: /clock
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
