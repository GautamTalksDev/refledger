# External clock for Refledger poll and canary workflows.
# Deploy only from this directory. Never bind routes or custom domains.
name = "refledger-clock"
main = "src/index.ts"
compatibility_date = "2026-09-29"
workers_dev = false
preview_urls = false

[triggers]
crons = ["2-57/5 * * * *", "17 */4 * * *"]
